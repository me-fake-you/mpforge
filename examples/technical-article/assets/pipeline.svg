    </g>
    <g fill="#f8fafc"><text x="145" y="210">Markdown</text><text x="370" y="210">AST</text><text x="595" y="210">Sanitize</text><text x="820" y="210">SHA-256</text></g>
    <g stroke="#f59e0b" stroke-width="8" stroke-linecap="round"><path d="M240 200h30"/><path d="M465 200h30"/><path d="M690 200h30"/></g>
