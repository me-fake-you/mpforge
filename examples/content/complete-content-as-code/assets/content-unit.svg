<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Auditable content unit</title>
  <desc id="desc">An article folder flows through review and build into a redacted receipt.</desc>
  <metadata>Original MPForge example artwork; MIT licensed with this repository.</metadata>
  <rect width="1200" height="630" fill="#fff8ed"/>
  <g stroke="#9a4b2f" stroke-width="5" fill="#fffdf8">
    <path d="M90 180 H340 L385 225 V450 H90 Z"/>
    <rect x="465" y="185" width="270" height="260" rx="24"/>
    <path d="M815 180 H1080 V450 H815 Z"/>
  </g>
  <g stroke="#d08456" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M385 315 H465"/>
    <path d="M735 315 H815"/>
  </g>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#5b2e22">
    <text x="237" y="275" font-size="34">article.md</text>
    <text x="237" y="325" font-size="27">assets + audit</text>
    <text x="600" y="275" font-size="34">review</text>
    <text x="600" y="325" font-size="34">lint</text>
    <text x="600" y="375" font-size="34">render</text>
    <text x="947" y="285" font-size="34">receipt</text>
    <text x="947" y="340" font-size="27">hashes, no secrets</text>
  </g>
</svg>

